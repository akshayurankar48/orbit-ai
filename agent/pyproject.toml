[project]
name = "launchpad-onboarding-agent"
version = "0.1.0"
description = "LiveKit worker for Orbit AI's Synthesia onboarding guide"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,silero]>=1.8.2,<2",
    "livekit-plugins-synthesia~=1.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
